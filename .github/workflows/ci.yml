name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-test:
    name: Swift Package Tests
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run hosted CI checks
        run: Scripts/github-ci.sh
